{{- if .Values.metrics.enabled }}
{{- if not .Values.metrics.disableAuth -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "temporal-worker-controller.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-metrics-reader
rules:
  - nonResourceURLs:
      - "/metrics"
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "temporal-worker-controller.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-proxy-role
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "temporal-worker-controller.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-proxy-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-proxy-role
subjects:
  # Must match the ServiceAccount the manager pod actually runs as (see
  # serviceaccount.yaml and manager.yaml). Naming a different one leaves
  # kube-rbac-proxy unable to create TokenReviews, so it cannot authenticate any
  # caller and answers 401 to every scrape.
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default (printf "%s-service-account" .Release.Name) }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "temporal-worker-controller.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-metrics-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: https
  selector:
    {{- include "temporal-worker-controller.selectorLabels" . | nindent 4 }}
---
{{- end -}}
{{- end }}
