name: Build Temporal Worker Controller
on:
  push:
    branches:
    - v1.2.0-atlan
    - feat/enable-twd-autoscaling
jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ORG_PAT_GITHUB }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/atlanhq/temporal-worker-controller:1.2.0-atlan-1.2-${{ github.sha }}
            ghcr.io/atlanhq/temporal-worker-controller:1.2.0-atlan-1.2

  push-chart:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.ORG_PAT_GITHUB }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Package and push Helm chart
        run: |
          helm package helm/temporal-worker-controller
          helm push temporal-worker-controller-1.2.0-atlan-1.2.tgz oci://ghcr.io/atlanhq/charts
