name: Build Temporal Worker Controller
on:
  push:
    branches:
    - v1.6.0-atlan
    - arun-925-v1.6.0-rebase
  pull_request:
    branches:
    - v1.6.0-atlan
    - arun-925-v1.6.0-rebase

concurrency:
  group: build-image-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # For PRs build the exact head commit so the sha-<head> tag matches the
          # image content; pushes use the default ref.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Compute tags and push mode
        id: meta
        run: |
          version="$(grep '^version:' helm/temporal-worker-controller/Chart.yaml | awk '{print $2}')"
          image="ghcr.io/atlanhq/temporal-worker-controller"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR builds: an immutable sha tag (pin this when deploying for
            # validation) plus a moving pr-<n> tag. The chart-version tags stay
            # reserved for branch pushes.
            head_sha="${{ github.event.pull_request.head.sha }}"
            echo "tags=${image}:sha-${head_sha},${image}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            # Fork PRs have no ORG_PAT_GITHUB: build-only.
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
              echo "push=true" >> "$GITHUB_OUTPUT"
            else
              echo "push=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tags=${image}:${version}-${{ github.sha }},${image}:${version}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ORG_PAT_GITHUB }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.meta.outputs.push == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}

  push-chart:
    if: github.event_name == 'push'
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.ORG_PAT_GITHUB }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Package and push Helm charts
        run: |
          CHART_VERSION=$(grep '^version:' helm/temporal-worker-controller/Chart.yaml | awk '{print $2}')
          # The controller chart declares a condition-gated cert-manager subchart dep;
          # helm package requires every dep vendored even though Atlan sets certmanager.install=false.
          helm repo add jetstack https://charts.jetstack.io
          helm dependency build helm/temporal-worker-controller
          helm package helm/temporal-worker-controller
          helm push "temporal-worker-controller-${CHART_VERSION}.tgz" oci://ghcr.io/atlanhq/charts
          # v1.6.0 splits CRDs into their own chart; publish it too, or the controller
          # crash-loops on the missing WorkerResourceTemplate CRD (validated on-cluster).
          CRDS_VERSION=$(grep '^version:' helm/temporal-worker-controller-crds/Chart.yaml | awk '{print $2}')
          helm package helm/temporal-worker-controller-crds
          helm push "temporal-worker-controller-crds-${CRDS_VERSION}.tgz" oci://ghcr.io/atlanhq/charts
